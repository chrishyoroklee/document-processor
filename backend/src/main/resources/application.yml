spring:
  application:
    name: docproc

  # Defaults match docker-compose.yml. Each can be overridden with an environment
  # variable, e.g. DB_URL=jdbc:postgresql://db:5432/docproc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docproc}
    username: ${DB_USER:docproc}
    password: ${DB_PASSWORD:docproc}

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it
    # and fails at startup if they don't.
    hibernate:
      ddl-auto: validate
    # Don't keep the DB session open while JSON is rendered. This forces us to
    # load everything we need inside the service (see "DTOs" in the spec).
    open-in-view: false

# Print every SQL statement Hibernate runs, so you can see what each request costs.
logging:
  level:
    org.hibernate.SQL: debug
