# Local development database.
#   docker compose up -d      start Postgres in the background
#   docker compose down       stop it (data survives in the named volume)
#   docker compose down -v    stop it and delete the data
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docproc
      POSTGRES_USER: docproc
      POSTGRES_PASSWORD: docproc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docproc"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
